name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface the Gradle failure reason as an annotation so it shows on
          # the run summary and PR without opening the full log.
          {
            grep -E '^(e: |w: .*error|C/C\+\+: .*error|.*error: )' build.log | head -40
            echo "----"
            grep -A 25 'What went wrong' build.log | head -60
          } > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${msg}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS5onA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
